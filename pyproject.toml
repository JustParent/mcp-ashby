[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-ashby-connector"
version = "0.1.0"
description = "Model Context Protocol (MCP) server implementation for Ashby ATS integration"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["mcp", "llm", "ashby", "ats"]
dependencies = [
    # mcp 2.0 removed the low-level Server.list_tools()/call_tool() decorators
    # this server applies at import time. uvx resolves from this list and ignores
    # uv.lock, so the cap is what keeps a fresh install off the incompatible major.
    "mcp>=1.1.2,<2",
    "requests>=2.32,<3",
    "python-dotenv>=1.0,<2",
]
license = { text = "MIT" }
authors = [
    { name = "Nicolas Thouzeau", email = "nicolas.thouzeau@gmail.com" }
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[project.urls]
Homepage = "https://github.com/thz/MCP-Ashby"

[project.scripts]
ashby = "src.ashby:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]
